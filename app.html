<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>✅ SeriouslyPrivateChecklist — app (alpha)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="banner" role="alert">
  ⚠️ <strong>Alpha.</strong> Work in progress — the list lives only in this URL.
</div>
<main>
  <h1>✅ SeriouslyPrivateChecklist</h1>
  <p class="tagline">Your list lives <strong>only in this URL</strong> — copy the address bar to share it.
  Nothing is stored on your device: no cookies, no localStorage.</p>

  <div class="title-row">
    <h2 id="list-title" class="list-title">Untitled checklist</h2>
    <input id="title-input" type="text" hidden spellcheck="false" aria-label="Checklist title">
    <button id="edit-title" type="button" class="icon-btn" title="Edit title" aria-label="Edit title"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" overflow="visible"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="butt" stroke-linejoin="miter"><path d="M3.715 19.055L4.127 16.29L4.55 15.45L15.139 4.861L17.261 4.861L19.139 6.739L19.139 8.861L8.55 19.45L7.71 19.873L4.945 20.285L3.715 19.055Z"/><path d="M13.5 6.5L17.5 10.5"/></g></svg></button>
  </div>

  <div class="toolbar">
    <input id="new-task" type="text" placeholder="Add an item and press Enter" aria-label="New item">
    <button id="add-btn" type="button">Add</button>
    <button id="copy-link" type="button">🔗 Copy link</button>
    <button id="share-private" type="button">🔒 Share privately</button>
    <button id="copy-md" type="button">📋 Copy Markdown</button>
    <button id="download-md" type="button">⬇️ .md</button>
    <button id="edit-md" type="button">✏️ Edit Markdown</button>
  </div>

  <div id="length" class="length ok" aria-live="polite"></div>
  <div id="status" class="status" aria-live="polite"></div>

  <ul id="list" class="checklist"></ul>
  <textarea id="raw" hidden spellcheck="false" aria-label="Raw Markdown editor"></textarea>

  <div id="pass-panel" class="pass-panel" hidden>
    <p id="pass-title"></p>
    <input id="pass-input" type="password" autocomplete="off" aria-label="Passphrase">
    <button id="pass-ok" type="button">OK</button>
    <button id="pass-cancel" type="button">Cancel</button>
    <p id="pass-error" class="status error"></p>
  </div>

  <p class="hint"><a href="index.html">← About this project</a> · <span class="commit-ref" title="Deployed commit">5ad6fa8</span></p>
</main>
<script src="app.js"></script>
</body>
</html>
